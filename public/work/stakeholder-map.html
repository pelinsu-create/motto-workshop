  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #FFFFFF;
      --fg: #111827;
      --border: #E5E7EB;
      --muted: #6B7280;
      --accent: #3B82F6;
      --hover-bg: #F3F4F6;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      height: 100vh;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      font-size: 18px;
      font-weight: 600;
      color: var(--fg);
    }

    .logo-subtitle {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }

    .company-selector {
      display: flex;
      gap: 8px;
    }

    .company-tab {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--muted);
    }

    .company-tab:hover {
      background: var(--hover-bg);
    }

    .company-tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .canvas {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    #map-svg {
      width: 100%;
      height: 100%;
    }

    .node {
      cursor: pointer;
      transition: all 0.3s;
      opacity: 1;
      transform-origin: center;
    }

    .node.selected {
      transform: scale(1.15);
    }

    .node.connected {
      transform: scale(1.08);
    }

    .node.faded {
      opacity: 0.3;
      filter: grayscale(50%);
    }

    .node:not(.selected):not(.connected):not(.faded):hover {
      transform: scale(1.05);
    }

    .node-circle {
      fill: white;
      stroke-width: 2;
      filter: drop-shadow(0 2px 8px rgba(17, 24, 39, 0.1));
      transition: all 0.3s;
    }

    .node.selected .node-circle {
      filter: drop-shadow(0 0 12px currentColor);
    }

    .node.connected .node-circle {
      filter: drop-shadow(0 0 6px currentColor);
    }

    .node-icon {
      font-size: 20px;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .node-label {
      font-size: 10px;
      font-weight: 600;
      text-anchor: middle;
      pointer-events: none;
      fill: var(--fg);
      max-width: 120px;
    }

    .layer-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      text-anchor: middle;
      opacity: 0.8;
    }

    .connection-line {
      stroke-width: 2;
      fill: none;
      opacity: 0;
      pointer-events: none;
      stroke-dasharray: 6 4;
      stroke-dashoffset: 1000;
      transition: opacity 0.3s;
    }

    .connection-line.visible {
      opacity: 0.9;
      stroke-dashoffset: 0;
      animation: draw-line 0.5s ease-out forwards;
    }

    @keyframes draw-line {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }

    .relationship-label {
      font-size: 10px;
      font-weight: 700;
      fill: #1F2937;
      text-anchor: middle;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .relationship-label.visible {
      opacity: 1;
    }

    .relationship-badge {
      fill: rgba(255, 255, 255, 0.95);
      stroke: #d1d5db;
      stroke-width: 1.5;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.2));
      opacity: 0;
      transition: opacity 0.3s;
    }

    .relationship-badge.visible {
      opacity: 1;
    }

    .popover {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: white;
      border-top: 2px solid var(--border);
      box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1), 0 -2px 4px -1px rgba(0, 0, 0, 0.06);
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: height 300ms ease-in-out, opacity 0.2s, transform 0.2s;
      transform: translateY(20px);
    }

    .popover.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .popover.expanded {
      height: 320px;
    }

    .popover-header-bar {
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s;
      border-bottom: 1px solid transparent;
    }

    .popover.expanded .popover-header-bar {
      border-bottom: 1px solid var(--border);
    }

    .popover-header-bar:hover {
      background: var(--hover-bg);
    }

    .popover-expandable-content {
      height: 260px;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease-in-out;
    }

    .popover.expanded .popover-expandable-content {
      opacity: 1;
      pointer-events: auto;
    }

    .toggle-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: transparent;
      transition: background 0.2s;
      color: var(--muted);
      font-size: 20px;
      user-select: none;
    }

    .toggle-icon:hover {
      background: var(--hover-bg);
    }

    .popover-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .popover-value {
      font-size: 12px;
      color: var(--fg);
      line-height: 1.5;
    }

    .popover-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .popover-list li {
      font-size: 12px;
      color: var(--fg);
      line-height: 1.6;
      padding-left: 12px;
      position: relative;
    }

    .popover-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    .source-badge {
      display: inline-block;
      padding: 2px 6px;
      background: #E0F2FE;
      color: #0369A1;
      font-size: 9px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 4px;
    }

    .source-badge.needs-research {
      background: #FEF3C7;
      color: #92400E;
    }

    .node-circle.unknown {
      stroke-dasharray: 4 4;
      stroke-width: 3;
    }

    .layer-module {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .layer-module-title {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .layer-module-items {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .layer-module-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .layer-module-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .layer-module-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--fg);
    }
  </style>
</head>

          <p id="password-error" style="color:#EF4444;font-size:13px;margin:8px 0 0 0;display:none;">Incorrect password</p>
          <button type="submit"
            style="width:100%;padding:10px 0;background:#3B82F6;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;margin-top:16px;transition:background 0.2s;"
            onmouseover="this.style.background='#2563EB'" onmouseout="this.style.background='#3B82F6'">
            Sign In
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
  (function() {
    var CORRECT = 'bax2026';
    if (sessionStorage.getItem('stakeholder-auth') === 'true') {
      document.getElementById('password-gate').style.display = 'none';
    }
    document.getElementById('password-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var input = document.getElementById('password-input');
      if (input.value === CORRECT) {
        sessionStorage.setItem('stakeholder-auth', 'true');
        document.getElementById('password-gate').style.display = 'none';
      } else {
        document.getElementById('password-error').style.display = 'block';
        input.value = '';
      }
    });
  })();
  </script>

    let activeCompany = COMPANIES[0];
    let selectedNode = null;
    let nodePositions = {};
    let isExpanded = false;

    function init() {
      renderCompanySelector();
      renderMap();
      renderLayerModule();
      showProfileSummary();

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.node') && !e.target.closest('.popover')) {
          if (selectedNode) {
            selectedNode = null;
            isExpanded = false;
            updateConnectionLines();
            updateNodeStates();
            showProfileSummary();
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isExpanded) {
          isExpanded = false;
          const popover = document.getElementById('popover');
          popover.classList.remove('expanded');
        }
      });
    }

    function renderCompanySelector() {
      const selector = document.getElementById('company-selector');
      selector.innerHTML = COMPANIES.map(company => `
        <button
          class="company-tab ${company.id === activeCompany.id ? 'active' : ''}"
          onclick="selectCompany('${company.id}')"
        >
          ${company.name}
        </button>
      `).join('');
    }

    function selectCompany(id) {
      activeCompany = COMPANIES.find(c => c.id === id);
      selectedNode = null;
      isExpanded = false;
      renderCompanySelector();
      renderMap();
      showProfileSummary();
    }

    function renderMap() {
      const svg = document.getElementById('map-svg');
      const container = svg.parentElement;
      const width = container.clientWidth;
      const height = container.clientHeight;

      const cx = width / 2;
      const cy = height * 0.85;

      const radii = [
        height * 0.20,
        height * 0.40,
        height * 0.55,
        height * 0.70,
        height * 0.85
      ];

      let svgContent = `
        <defs>
          <filter id="node-shadow">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
          </filter>
      `;

      LAYERS.forEach(layer => {
        svgContent += `
          <marker id="arrow-${layer.key}" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="${layer.color}" />
          </marker>
        `;
      });

      svgContent += `</defs>`;

      LAYERS.forEach((layer, i) => {
        const outerR = radii[i];
        const innerR = i > 0 ? radii[i - 1] : 0;

        if (i === 0) {
          svgContent += `
            <path d="M ${cx - outerR} ${cy} A ${outerR} ${outerR} 0 0 1 ${cx + outerR} ${cy} L ${cx} ${cy} Z"
                  fill="${layer.color}" opacity="0.05" stroke="${layer.color}" stroke-width="1"/>
          `;
        } else {
          const startX = cx - outerR;
          const endX = cx + outerR;
          const innerStartX = cx - innerR;
          const innerEndX = cx + innerR;

          svgContent += `
            <path d="M ${startX} ${cy} A ${outerR} ${outerR} 0 0 1 ${endX} ${cy}
                     L ${innerEndX} ${cy} A ${innerR} ${innerR} 0 0 0 ${innerStartX} ${cy} Z"
                  fill="${layer.color}" opacity="0.05" stroke="${layer.color}" stroke-width="1"/>
          `;
        }

        const labelY = cy - outerR + 25;
        const labelX = cx;

        svgContent += `
          <text x="${labelX}" y="${labelY}" class="layer-label" fill="${layer.color}" text-anchor="middle">
            ${layer.name.toUpperCase()}
          </text>
        `;
      });

      nodePositions = {};
      LAYERS.forEach((layer, layerIdx) => {
        const layerStakeholders = activeCompany.stakeholders.filter(s => s.layer === layer.key);
        const count = layerStakeholders.length;
        const radius = radii[layerIdx];

        const startAngle = Math.PI;
        const endAngle = 0;
        const angleStep = (startAngle - endAngle) / (count + 1);

        layerStakeholders.forEach((stakeholder, idx) => {
          const angle = startAngle - angleStep * (idx + 1);
          const x = cx + radius * Math.cos(angle);
          const y = cy - radius * Math.sin(angle);
          nodePositions[stakeholder.name] = { x, y, layer: layer.key, color: layer.color };
        });
      });

      activeCompany.stakeholders.forEach(stakeholder => {
        const pos = nodePositions[stakeholder.name];
        if (!pos) return;

        const layer = LAYERS.find(l => l.key === stakeholder.layer);
        const icon = getIcon(stakeholder.name);
        const nodeClass = getNodeClass(stakeholder.name);
        const isUnknown = stakeholder.name.startsWith('?') || stakeholder.confidence === 'UNKNOWN';
        const circleClass = isUnknown ? 'node-circle unknown' : 'node-circle';

        svgContent += `
          <g
            class="node ${nodeClass}"
            data-name="${stakeholder.name}"
            onclick="event.stopPropagation(); handleNodeClick('${stakeholder.name.replace(/'/g, "\\'")}', event)"
          >
            <circle class="${circleClass}" cx="${pos.x}" cy="${pos.y}" r="28"
                    stroke="${layer.color}" filter="url(#node-shadow)"/>
            <text class="node-icon" x="${pos.x}" y="${pos.y}">${icon}</text>
            <text class="node-label" x="${pos.x}" y="${pos.y + 44}">${stakeholder.name}</text>
          </g>
        `;
      });

      activeCompany.stakeholders.forEach(stakeholder => {
        const from = nodePositions[stakeholder.name];
        if (!from || !stakeholder.connections) return;

        stakeholder.connections.forEach(conn => {
          const to = nodePositions[conn.toId];
          if (!to) return;

          const midX = (from.x + to.x) / 2;
          const midY = (from.y + to.y) / 2;
          const controlY = midY - 40;

          const lineId = `line-${stakeholder.name.replace(/\s+/g, '-')}-${conn.toId.replace(/\s+/g, '-')}`;
          const badgeId = `badge-${stakeholder.name.replace(/\s+/g, '-')}-${conn.toId.replace(/\s+/g, '-')}`;
          const labelId = `label-${stakeholder.name.replace(/\s+/g, '-')}-${conn.toId.replace(/\s+/g, '-')}`;

          const fromLayer = LAYERS.find(l => l.key === stakeholder.layer);
          const badgeWidth = conn.relationship.length * 6.5 + 16;
          const badgeHeight = 22;

          svgContent += `
            <g data-from="${stakeholder.name}" data-to="${conn.toId}">
              <path
                id="${lineId}"
                class="connection-line"
                d="M ${from.x} ${from.y} Q ${midX} ${controlY} ${to.x} ${to.y}"
                stroke="${fromLayer.color}"
                marker-end="url(#arrow-${stakeholder.layer})"
                data-from="${stakeholder.name}"
                data-to="${conn.toId}"
              />
              <rect
                id="${badgeId}"
                class="relationship-badge"
                x="${midX - badgeWidth / 2}"
                y="${controlY - badgeHeight / 2}"
                width="${badgeWidth}"
                height="${badgeHeight}"
                rx="${badgeHeight / 2}"
                data-from="${stakeholder.name}"
                data-to="${conn.toId}"
              />
              <text
                id="${labelId}"
                class="relationship-label"
                x="${midX}"
                y="${controlY + 3}"
                data-from="${stakeholder.name}"
                data-to="${conn.toId}"
              >${conn.relationship}</text>
            </g>
          `;
        });
      });

      svg.innerHTML = svgContent;
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

      updateConnectionLines();
    }

    function getNodeClass(name) {
      if (!selectedNode) return '';
      if (name === selectedNode) return 'selected';

      const selectedStakeholder = activeCompany.stakeholders.find(s => s.name === selectedNode);
      if (selectedStakeholder && selectedStakeholder.connections) {
        const isConnected = selectedStakeholder.connections.some(c => c.toId === name);
        if (isConnected) return 'connected';
      }

      return 'faded';
    }

    function handleNodeClick(name, event) {
      if (selectedNode === name) {
        selectedNode = null;
        isExpanded = false;
        updateConnectionLines();
        updateNodeStates();
        showProfileSummary();
      } else {
        selectedNode = name;
        showPopover(event, name);
        updateConnectionLines();
        updateNodeStates();
      }
    }

    function updateNodeStates() {
      document.querySelectorAll('.node').forEach(node => {
        const name = node.dataset.name;
        node.className = 'node ' + getNodeClass(name);
      });
    }

    function updateConnectionLines() {
      document.querySelectorAll('.connection-line, .relationship-badge, .relationship-label').forEach(el => {
        el.classList.remove('visible');
      });

      if (!selectedNode) {
        return;
      }

      setTimeout(() => {
        document.querySelectorAll('.connection-line, .relationship-badge, .relationship-label').forEach(el => {
          if (el.dataset.from === selectedNode) {
            el.classList.add('visible');
          }
        });
      }, 50);
    }

    function showPopover(event, name) {
      const stakeholder = activeCompany.stakeholders.find(s => s.name === name);
      if (!stakeholder) return;

      selectedNode = name;
      isExpanded = true;
      updateConnectionLines();

      const layer = LAYERS.find(l => l.key === stakeholder.layer);
      const icon = getIcon(stakeholder.name);
      const hasConnections = stakeholder.connections && stakeholder.connections.length > 0;
      const hasTools = stakeholder.tools && stakeholder.tools.length > 0;
      const isUnknown = stakeholder.name.startsWith('?') || stakeholder.confidence === 'UNKNOWN';
      const badgeClass = isUnknown ? 'source-badge needs-research' : 'source-badge';
      const badgeText = isUnknown ? 'NEEDS RESEARCH' : 'VALIDATED';

      const popover = document.getElementById('popover');
      popover.innerHTML = `
        <div class="popover-header-bar" onclick="toggleExpand(event)">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 24px;">${icon}</span>
            <div>
              <div style="font-size: 16px; font-weight: 700; color: var(--fg);">
                ${stakeholder.name}
              </div>
              <div style="font-size: 11px; font-weight: 600; color: ${layer.color}; text-transform: uppercase; letter-spacing: 0.05em;">
                ${layer.name} <span class="${badgeClass}">${badgeText}</span>
              </div>
            </div>
          </div>
          <div class="toggle-icon">
            ${isExpanded ? '︾' : '︿'}
          </div>
        </div>

        <div class="popover-expandable-content">
          <div style="padding: 16px 24px;">

            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 12px;">

              <div>
                <div style="margin-bottom: 12px;">
                  <div class="popover-label">Module</div>
                  <div class="popover-value">${stakeholder.module}</div>
                </div>
                <div>
                  <div class="popover-label">Action</div>
                  <div class="popover-value">${stakeholder.action}</div>
                </div>
              </div>

              <div>
                <div class="popover-label">Source</div>
                <div class="popover-value" style="font-style: italic; color: #0369A1;">
                  ${stakeholder.source || 'Research file'}
                </div>
                ${hasTools ? `
                  <div style="margin-top: 12px;">
                    <div class="popover-label">Tools & Systems</div>
                    <ul class="popover-list">
                      ${stakeholder.tools.map(tool => `<li>${tool}</li>`).join('')}
                    </ul>
                  </div>
                ` : ''}
              </div>

              <div>
                ${hasConnections ? `
                  <div class="popover-label">Connections (${stakeholder.connections.length})</div>
                  <ul class="popover-list">
                    ${stakeholder.connections.map(conn => `
                      <li><strong>${conn.toId}</strong> <span style="color: var(--muted); font-size: 11px;">(${conn.relationship})</span></li>
                    `).join('')}
                  </ul>
                ` : `
                  <div class="popover-label">Connections</div>
                  <div class="popover-value" style="color: var(--muted);">No direct connections</div>
                `}
              </div>

            </div>

          </div>
        </div>
      `;

      popover.classList.add('visible');
      popover.classList.add('expanded');
    }

    function hidePopover() {
      document.getElementById('popover').classList.remove('visible');
    }

    function toggleExpand(event) {
      if (event) event.stopPropagation();
      isExpanded = !isExpanded;
      const popover = document.getElementById('popover');

      if (isExpanded) {
        popover.classList.add('expanded');
      } else {
        popover.classList.remove('expanded');
      }
    }

    function showProfileSummary() {
      const summary = PROFILE_SUMMARIES[activeCompany.id];
      if (!summary) return;

      isExpanded = false;

      const popover = document.getElementById('popover');
      popover.innerHTML = `
        <div class="popover-header-bar" onclick="toggleExpand(event)">
          <div style="display: flex; align-items: center; gap: 12px;">
            <span style="font-size: 24px;">${summary.icon}</span>
            <div>
              <div style="font-size: 16px; font-weight: 700; color: var(--fg);">
                ${summary.title}
              </div>
              <div style="font-size: 11px; color: var(--muted);">
                Click a stakeholder to see validated details
              </div>
            </div>
          </div>
          <div class="toggle-icon">
            ${isExpanded ? '︾' : '︿'}
          </div>
        </div>

        <div class="popover-expandable-content">
          <div style="padding: 20px 32px;">
            <div style="max-width: 1400px; margin: 0 auto;">

              <p style="font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 16px;">
                ${summary.description}
              </p>

              <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px;">

                <div>
                  <h3 style="font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">
                    Sites/Assets
                  </h3>
                  <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px;">
                    ${summary.examples.map(ex => `
                      <li style="font-size: 11px; color: var(--fg);">• ${ex}</li>
                    `).join('')}
                  </ul>
                </div>

                <div>
                  <h3 style="font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">
                    Scale
                  </h3>
                  <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px;">
                    ${summary.scale.map(s => `
                      <li style="font-size: 11px; color: var(--fg);">• ${s}</li>
                    `).join('')}
                  </ul>
                </div>

                <div>
                  <h3 style="font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">
                    Characteristics
                  </h3>
                  <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px;">
                    ${summary.characteristics.map(c => `
                      <li style="font-size: 11px; color: var(--fg);">• ${c}</li>
                    `).join('')}
                  </ul>
                </div>

                <div>
                  <h3 style="font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">
                    Primary Needs
                  </h3>
                  <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                    ${summary.needs.map(need => `
                      <span style="padding: 4px 8px; background: var(--hover-bg); color: var(--muted); font-size: 10px; border-radius: 12px; white-space: nowrap;">
                        ${need}
                      </span>
                    `).join('')}
                  </div>
                </div>

                <div>
                  <h3 style="font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">
                    Research Sources
                  </h3>
                  <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px;">
                    ${summary.sources.map(src => `
                      <li style="font-size: 11px; color: #0369A1; font-weight: 500;">• ${src}</li>
                    `).join('')}
                  </ul>
                </div>

              </div>

            </div>
          </div>
        </div>
      `;

      popover.classList.add('visible');
      popover.classList.remove('expanded');
    }

    function renderLayerModule() {
      const module = document.getElementById('layer-module');
      module.innerHTML = `
        <div class="layer-module-title">Layers</div>
        <div class="layer-module-items">
          ${LAYERS.map(layer => `
            <div class="layer-module-item">
              <div class="layer-module-dot" style="background: ${layer.color}"></div>
              <span class="layer-module-label">${layer.name}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    window.onload = init;
    window.addEventListener('resize', renderMap);
  </script>
</body>
</html>
